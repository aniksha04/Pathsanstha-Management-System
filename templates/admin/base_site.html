
{% extends "admin/base.html" %}

{% block title %}Pathsanstha | Administration{% endblock %}

{% block branding %}
<div id="site-name">
    <a href="{% url 'admin:index' %}">
        ✦ Pathsanstha Administration
    </a>
</div>
{% endblock %}

{% block extrastyle %}
{{ block.super }}

<style>
    :root {
        --primary: #176b50;
        --secondary: #104936;
        --accent: #c69b45;
        --background: #f7f6ef;
        --light-green: #e6f2eb;
        --text: #25352e;
        --border: #e2e9e3;
    }

    body {
        background: var(--background);
        color: var(--text);
        font-family: Arial, sans-serif;
    }

    #header {
        background: var(--secondary);
        color: white;
        padding: 15px 25px;
    }

    #site-name a {
        color: white !important;
        font-size: 23px;
        font-weight: bold;
        text-decoration: none;
    }

    #site-name a:hover {
        color: var(--light-green) !important;
    }

    #user-tools {
        color: white;
    }

    #user-tools a {
        color: #f0d89e !important;
    }

    a:link,
    a:visited {
        color: var(--primary);
    }

    a:hover {
        color: var(--secondary);
    }

    .module h2,
    .module caption,
    .inline-group h2 {
        background: var(--primary);
        color: white;
    }

    .module {
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
    }

    #content {
        padding: 25px;
    }

    .button,
    input[type=submit],
    input[type=button],
    .submit-row input,
    a.button {
        background: var(--primary) !important;
        color: white !important;
        border: none !important;
        border-radius: 5px;
        padding: 9px 16px;
        font-weight: bold;
    }

    .button:hover,
    input[type=submit]:hover,
    input[type=button]:hover,
    .submit-row input:hover {
        background: var(--secondary) !important;
    }

    .object-tools a {
        background: var(--primary) !important;
        border-radius: 5px;
    }

    .object-tools a:hover {
        background: var(--secondary) !important;
    }

    #changelist-filter h2 {
        background: var(--primary);
        color: white;
    }

    #changelist table thead th {
        background: var(--light-green);
        color: var(--secondary);
    }

    #changelist table tbody tr:nth-child(even) {
        background: #fafbf8;
    }

    input:focus,
    textarea:focus,
    select:focus {
        border-color: var(--primary) !important;
        outline: 1px solid var(--primary);
    }

    #footer {
        padding: 15px;
    }

    @media (max-width: 767px) {
        #content {
            padding: 15px;
        }

        #site-name a {
            font-size: 18px;
        }
    }
</style>
{% endblock %}
